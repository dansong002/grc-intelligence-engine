    <style>
      html { background: #0e1419; }
      body { margin: 0; }
    </style>
    <script>
      // Pre-paint theme guard: match the saved theme's canvas before React
      // mounts so switching to Light doesn't flash dark on reload (and vice
      // versa). Keep the color map in sync with THEMES in src/App.jsx.
      try {
        var t = localStorage.getItem("grc-theme");
        var bg = { light: "#FAF9F6", dark: "#0E1419", nocturne: "#0A0F17" }[t];
        if (bg) { document.documentElement.style.background = bg; }
      } catch (e) {}
    </script>
